name: TikTok Sandbox Demo

on:
  workflow_dispatch

jobs:
  sandbox-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Verify secrets
        run: |
          if [ -z "${{ secrets.TIKTOK_CLIENT_ID }}" ]; then
            echo "Missing TIKTOK_CLIENT_ID"
            exit 1
          fi
          if [ -z "${{ secrets.TIKTOK_CLIENT_SECRET }}" ]; then
            echo "Missing TIKTOK_CLIENT_SECRET"
            exit 1
          fi
          echo "Secrets OK"

      - name: Start backend
        timeout-minutes: 1
        env:
          TIKTOK_CLIENT_ID: ${{ secrets.TIKTOK_CLIENT_ID }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
        run: |
          timeout 30 node tiktok-sandbox-backend.js >backend.log 2>&1 &
          for i in {1..10}; do
            curl -s http://localhost:3001/health | grep -q "ok" && exit 0
            sleep 1
          done
          exit 1

      - name: Start frontend
        timeout-minutes: 1
        run: |
          [ -f tiktok-sandbox-demo.html ] || exit 1
          timeout 30 python3 -m http.server 3000 >frontend.log 2>&1 &
          for i in {1..10}; do
            curl -s http://localhost:3000/tiktok-sandbox-demo.html | grep -q "Sign in" && exit 0
            sleep 1
          done
          exit 1

      - name: Start ngrok
        timeout-minutes: 2
        run: |
          wget -q https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-linux-amd64.zip
          if [ ! -f ngrok-v3-stable-linux-amd64.zip ]; then
            echo "Failed to download ngrok"
            exit 1
          fi
          unzip -q ngrok-v3-stable-linux-amd64.zip
          if [ ! -f ngrok ]; then
            echo "Failed to unzip ngrok"
            exit 1
          fi
          chmod +x ngrok
          timeout 60 ./ngrok http 3000 >ngrok.log 2>&1 &
          NGROK_PID=$!
          echo "ngrok started with PID: $NGROK_PID"
          sleep 3
          if ! ps -p $NGROK_PID > /dev/null; then
            echo "ngrok process died immediately"
            cat ngrok.log
            exit 1
          fi
          sleep 5
          echo "Checking if ngrok API is listening..."
          if ! curl -s http://localhost:4040/api/tunnels > /dev/null 2>&1; then
            echo "ngrok API not responding after 8 seconds"
            echo "ngrok.log contents:"
            cat ngrok.log
            netstat -tuln | grep 4040 || echo "Port 4040 not listening"
            ps aux | grep ngrok | grep -v grep || echo "ngrok process not found"
          fi

      - name: Get ngrok URL
        timeout-minutes: 2
        run: |
          echo "Waiting for ngrok tunnel to be created..."
          for i in {1..60}; do
            echo "Attempt $i/60..."
            RESPONSE=$(curl -s http://localhost:4040/api/tunnels 2>/dev/null || true)
            if [ -z "$RESPONSE" ]; then
              echo "  No response from API yet"
              sleep 1
              continue
            fi
            echo "  Got response, checking for tunnel..."
            URL=$(echo "$RESPONSE" | grep -o 'https://[a-z0-9.-]*\.ngrok[a-z0-9.-]*' | head -1)
            if [ -n "$URL" ]; then
              echo "  Found tunnel URL: $URL"
              echo "URL=$URL" >/tmp/demo.env
              exit 0
            fi
            echo "  Response has no tunnel yet"
            sleep 1
          done
          echo "Failed to get ngrok URL after 60 attempts"
          echo "Last API response:"
          curl -s http://localhost:4040/api/tunnels || echo "API not responding"
          echo "ngrok process status:"
          ps aux | grep ngrok | grep -v grep || echo "ngrok not running"
          exit 1

      - name: Report demo
        if: always()
        run: |
          if [ -f /tmp/demo.env ]; then
            source /tmp/demo.env
            echo "DEMO_URL=$URL" >>$GITHUB_STEP_SUMMARY
            echo "Demo is ready at: $URL/tiktok-sandbox-demo.html" >>$GITHUB_STEP_SUMMARY
          else
            echo "Demo setup failed - check logs" >>$GITHUB_STEP_SUMMARY
          fi

      - name: Cleanup
        if: always()
        run: pkill -9 node python3 ngrok 2>/dev/null || true
