name: TikTok Sandbox Demo

on:
  workflow_dispatch

jobs:
  sandbox-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Verify secrets
        run: |
          if [ -z "${{ secrets.TIKTOK_CLIENT_ID }}" ]; then
            echo "Missing TIKTOK_CLIENT_ID"
            exit 1
          fi
          if [ -z "${{ secrets.TIKTOK_CLIENT_SECRET }}" ]; then
            echo "Missing TIKTOK_CLIENT_SECRET"
            exit 1
          fi
          echo "Secrets OK"

      - name: Start backend
        timeout-minutes: 1
        env:
          TIKTOK_CLIENT_ID: ${{ secrets.TIKTOK_CLIENT_ID }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          PUBLIC_URL: http://localhost:3001
        run: |
          timeout 120 node tiktok-sandbox-backend.js >backend.log 2>&1 &
          for i in {1..10}; do
            curl -s http://localhost:3001/health | grep -q "ok" && exit 0
            sleep 1
          done
          exit 1

      - name: Start frontend
        timeout-minutes: 1
        run: |
          [ -f tiktok-sandbox-demo.html ] || exit 1
          timeout 30 python3 -m http.server 3000 >frontend.log 2>&1 &
          for i in {1..10}; do
            curl -s http://localhost:3000/tiktok-sandbox-demo.html | grep -q "Sign in" && exit 0
            sleep 1
          done
          exit 1

      - name: Start ngrok
        timeout-minutes: 2
        run: |
          npm install -g localtunnel
          timeout 60 lt --port 3001 --print-requests >tunnel.log 2>&1 &
          TUNNEL_PID=$!
          echo "localtunnel started with PID: $TUNNEL_PID"
          sleep 3
          if ! ps -p $TUNNEL_PID > /dev/null; then
            echo "localtunnel process died immediately"
            cat tunnel.log
            exit 1
          fi
          sleep 5
          TUNNEL_URL=$(grep -oP 'https://[a-z0-9-]+\.loca\.lt' tunnel.log | head -1)
          if [ -z "$TUNNEL_URL" ]; then
            echo "Failed to get tunnel URL"
            echo "tunnel.log contents:"
            cat tunnel.log
            ps aux | grep lt | grep -v grep || echo "localtunnel not running"
            exit 1
          fi
          echo "TUNNEL_URL=$TUNNEL_URL" >/tmp/tunnel.env
          echo "Tunnel ready at: $TUNNEL_URL"

      - name: Get tunnel URL and restart backend
        timeout-minutes: 2
        env:
          TIKTOK_CLIENT_ID: ${{ secrets.TIKTOK_CLIENT_ID }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
        run: |
          if [ ! -f /tmp/tunnel.env ]; then
            echo "Tunnel URL file not found"
            cat tunnel.log || echo "No tunnel log"
            exit 1
          fi
          source /tmp/tunnel.env
          echo "Tunnel URL: $TUNNEL_URL"
          pkill -f "node tiktok-sandbox-backend.js" || true
          sleep 1
          timeout 120 env PUBLIC_URL="$TUNNEL_URL" node tiktok-sandbox-backend.js >backend.log 2>&1 &
          sleep 2
          for i in {1..10}; do
            HEALTH=$(curl -s http://localhost:3001/health || true)
            if echo "$HEALTH" | grep -q "ok"; then
              echo "Backend restarted with public URL: $TUNNEL_URL"
              echo "URL=$TUNNEL_URL" >/tmp/demo.env
              exit 0
            fi
            sleep 1
          done
          echo "Failed to restart backend with new PUBLIC_URL"
          exit 1

      - name: Report demo
        if: always()
        run: |
          if [ -f /tmp/demo.env ]; then
            source /tmp/demo.env
            echo "DEMO_URL=$URL" >>$GITHUB_STEP_SUMMARY
            echo "Demo is ready at: $URL/tiktok-sandbox-demo.html" >>$GITHUB_STEP_SUMMARY
            echo "Tunnel will remain active for 2 hours" >>$GITHUB_STEP_SUMMARY
            echo "demo_url=$URL" >>$GITHUB_OUTPUT
            echo "✅ Demo URL: $URL" >&2
            echo "✅ Full URL: $URL/tiktok-sandbox-demo.html" >&2
            # Write URL to file
            echo "$URL" > /tmp/demo_url.txt
            cat /tmp/demo_url.txt >&2
          else
            echo "Demo setup failed - check logs" >>$GITHUB_STEP_SUMMARY
          fi

      - name: Extract and display demo URL
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f /tmp/demo_url.txt ]; then
            DEMO_URL=$(cat /tmp/demo_url.txt)
            echo "====================="
            echo "DEMO URL: $DEMO_URL"
            echo "====================="
            echo "Full demo: $DEMO_URL/tiktok-sandbox-demo.html"
            echo "====================="

            # Write to file for easy retrieval
            echo "$DEMO_URL" > DEMO_URL_LATEST.txt
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git config user.name "github-actions[bot]"
            git add DEMO_URL_LATEST.txt
            git commit -m "Update demo URL: $DEMO_URL"
            git push "https://x-access-token:${GITHUB_TOKEN}@github.com/andraks-bit/andra-youtube-growth.git" HEAD:main
          fi

      - name: Keep tunnel alive
        if: always()
        run: sleep 7200

      - name: Cleanup
        if: always()
        run: pkill -9 node python3 lt 2>/dev/null || true
