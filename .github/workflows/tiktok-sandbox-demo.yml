name: TikTok Sandbox Demo - Secure OAuth Test

on:
  workflow_dispatch:

jobs:
  tiktok-sandbox-demo:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Verify GitHub Secrets configured
        run: |
          if [ -z "${{ secrets.TIKTOK_CLIENT_ID }}" ] || [ -z "${{ secrets.TIKTOK_CLIENT_SECRET }}" ]; then
            echo "❌ Required secrets not found"
            exit 1
          fi
          echo "✓ Credentials found in GitHub Secrets"

      - name: Start Backend Server
        timeout-minutes: 1
        env:
          TIKTOK_CLIENT_ID: ${{ secrets.TIKTOK_CLIENT_ID }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
        run: |
          timeout 30 node tiktok-sandbox-backend.js > backend.log 2>&1 &
          for i in {1..10}; do
            if curl -s http://localhost:3001/health 2>/dev/null | grep -q "ok"; then
              echo "✓ Backend ready"
              exit 0
            fi
            sleep 1
          done
          echo "❌ Backend timeout"
          exit 1

      - name: Start Frontend Server
        timeout-minutes: 1
        run: |
          timeout 30 python3 -m http.server 3000 > frontend.log 2>&1 &
          for i in {1..10}; do
            if curl -s http://localhost:3000/tiktok-sandbox-demo.html 2>/dev/null | grep -q "Sign in"; then
              echo "✓ Frontend ready"
              exit 0
            fi
            sleep 1
          done
          echo "❌ Frontend timeout"
          exit 1

      - name: Install and Start ngrok
        timeout-minutes: 1
        run: |
          wget -q https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-linux-amd64.zip
          unzip -q ngrok-v3-stable-linux-amd64.zip
          chmod +x ngrok
          timeout 30 ./ngrok http 3000 > ngrok.log 2>&1 &
          NGROK_PID=$!
          echo "ngrok PID: $NGROK_PID"
          sleep 3

      - name: Verify Backend Credentials
        timeout-minutes: 1
        run: |
          if curl -s http://localhost:3001/health 2>/dev/null | grep -q '"credentials":true'; then
            echo "✓ Credentials loaded"
          else
            echo "❌ Credentials not loaded"
            exit 1
          fi

      - name: Wait for ngrok and Write Summary
        run: |
          # Set trap to kill all background processes on exit
          trap 'kill $(jobs -p) 2>/dev/null || true' EXIT

          echo "Waiting for ngrok tunnel to initialize..."

          # Poll ngrok API until tunnel is ready (timeout 30 seconds)
          DEMO_URL=""
          for i in {1..30}; do
            RESPONSE=$(curl -s http://localhost:4040/api/tunnels 2>/dev/null)
            DEMO_URL=$(echo "$RESPONSE" | grep -oP '"public_url":"https://[^"]*' | head -1 | cut -d'"' -f4)

            if [ -n "$DEMO_URL" ]; then
              echo "✓ ngrok tunnel ready: $DEMO_URL"
              break
            fi

            sleep 1
          done

          # If still no URL, try extracting from logs
          if [ -z "$DEMO_URL" ]; then
            sleep 3
            DEMO_URL=$(grep -oP 'https://[a-z0-9.-]+\.ngrok(?:\.io|-free\.app)' ngrok.log 2>/dev/null | head -1)
          fi

          # Write to GitHub Actions Summary
          if [ -n "$DEMO_URL" ]; then
            cat > $GITHUB_STEP_SUMMARY << 'EOF'
          # 🎬 TikTok Sandbox Demo - Ready

          ## ✓ All Systems Running

          Your secure TikTok OAuth demo is ready with credentials loaded from GitHub Secrets.

          EOF

            cat >> $GITHUB_STEP_SUMMARY << EOF
          ### 🚀 **[CLICK HERE TO OPEN DEMO]($DEMO_URL/tiktok-sandbox-demo.html)**

          ### What to do:
          1. Click the link above
          2. Click blue button: **🔓 Sign in with TikTok (Sandbox)**
          3. Sign in as @andra.kiirkivi
          4. Approve permissions
          5. See "Authentication successful!"

          ### Security:
          - ✓ Credentials loaded from GitHub Secrets (never exposed)
          - ✓ Backend handles OAuth securely
          - ✓ Client Secret stays on server only
          EOF

            echo "✓ Summary written with demo URL: $DEMO_URL"
          else
            cat > $GITHUB_STEP_SUMMARY << 'EOF'
          # ⚠️ ngrok Not Ready

          Services are running but ngrok tunnel could not be established.

          Services:
          - Backend: http://localhost:3001 ✓
          - Frontend: http://localhost:3000 ✓
          - ngrok: Not available

          Check workflow logs for details.
          EOF

            echo "⚠️ Could not extract ngrok URL"
            exit 1
          fi

          # Kill all background processes - ensures workflow exits
          echo "Terminating all background processes..."
          pkill -TERM -f "node tiktok-sandbox-backend" 2>/dev/null || true
          pkill -TERM -f "python3 -m http.server" 2>/dev/null || true
          pkill -TERM -f "./ngrok http" 2>/dev/null || true
          pkill -TERM -f "ngrok http" 2>/dev/null || true

          # Give processes time to exit gracefully
          sleep 1

          # Force kill any remaining processes
          pkill -KILL -f "node tiktok-sandbox-backend" 2>/dev/null || true
          pkill -KILL -f "python3 -m http.server" 2>/dev/null || true
          pkill -KILL -f "ngrok" 2>/dev/null || true

          echo "✓ All processes terminated. Workflow complete."

