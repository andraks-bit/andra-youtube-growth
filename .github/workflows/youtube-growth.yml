name: YouTube Growth System (Andra Kiirkivi)

on:
  schedule:
    # 06:00 UTC daily. Adjust to taste -- this is the only schedule knob.
    - cron: "0 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run growth system
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Kill switch for Step 6's approval workflow actually writing to
          # YouTube. Unset/false by default -- approved proposals queue
          # indefinitely until this repo variable is deliberately set to
          # "true" (Settings -> Secrets and variables -> Actions -> Variables).
          YT_WRITES_ENABLED: ${{ vars.YT_WRITES_ENABLED }}
          # Step 7 controlled-pilot safeguard: when set to a proposal_id,
          # apply_approved() applies ONLY that proposal and holds back every
          # other approved one regardless of YT_WRITES_ENABLED. Unset outside
          # an explicit pilot window.
          YT_WRITES_PILOT_ONLY_PROPOSAL_ID: ${{ vars.YT_WRITES_PILOT_ONLY_PROPOSAL_ID }}
        run: python run_daily.py

      - name: Commit data, logs, and report
        if: always()
        run: |
          git config user.name "youtube-growth-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data logs reports/generated
          git diff --cached --quiet && exit 0
          git commit -m "Automated YouTube growth run $(date -u +%Y-%m-%d)"
          # Retry on push rejection (another push landed on main while this
          # run was executing, e.g. a manual commit or an overlapping run) --
          # fetch + rebase onto the new tip and retry, rather than losing
          # this run's report/data outright.
          for attempt in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt/5) -- fetching and rebasing onto origin/main"
            git fetch origin main
            git rebase origin/main
          done
          echo "Push still failing after 5 attempts -- giving up"
          exit 1
