name: TikTok Sandbox Integration Test

on:
  workflow_dispatch:
    inputs:
      video_file:
        description: 'Path to MP4 video file (relative to repo root, or leave empty for test video)'
        required: false
        default: 'test-video.mp4'

jobs:
  test-tiktok-sandbox:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up environment
        run: |
          chmod +x tiktok-integration-demo.sh

      - name: Create test video if needed
        run: |
          if [ ! -f "${{ github.event.inputs.video_file }}" ]; then
            echo "Creating test video..."
            sudo apt-get update && sudo apt-get install -y ffmpeg >/dev/null 2>&1
            ffmpeg -f lavfi -i testsrc=s=1280x720:d=5 -f lavfi -i sine=f=440:d=5 -pix_fmt yuv420p "${{ github.event.inputs.video_file }}" -y 2>/dev/null
            echo "✓ Test video created: ${{ github.event.inputs.video_file }}"
          fi

      - name: Verify GitHub Secrets are present
        env:
          TIKTOK_CLIENT_ID: ${{ secrets.TIKTOK_CLIENT_ID }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
        run: |
          if [ -z "$TIKTOK_CLIENT_ID" ] || [ -z "$TIKTOK_CLIENT_SECRET" ]; then
            echo "✗ ERROR: GitHub Secrets not found or empty"
            echo "Required secrets: TIKTOK_CLIENT_ID, TIKTOK_CLIENT_SECRET"
            exit 1
          fi
          echo "✓ GitHub Secrets verified (Client Key and Secret present)"

      - name: Run TikTok Sandbox Integration Test
        env:
          TIKTOK_CLIENT_ID: ${{ secrets.TIKTOK_CLIENT_ID }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
        run: |
          echo "Starting TikTok Sandbox integration test..."
          echo "Client Secret: [PROTECTED]"
          echo ""

          # Export variables to ensure they're available to the script
          export TIKTOK_CLIENT_ID="${TIKTOK_CLIENT_ID}"
          export TIKTOK_CLIENT_SECRET="${TIKTOK_CLIENT_SECRET}"

          ./tiktok-integration-demo.sh "${{ github.event.inputs.video_file }}"

      - name: Upload OAuth URL (unmaked by GitHub masking)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tiktok-oauth-url
          path: /tmp/tiktok_oauth_url.txt
          retention-days: 7

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tiktok-sandbox-test-results
          path: /tmp/tiktok_demo_state.json
          retention-days: 7
